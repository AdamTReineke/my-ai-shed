<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="756" height="302" viewBox="0 0 756 302">
  <style>
    .board { stroke: #8b4513; stroke-width: 1.5; }
    .board-rafter { fill: #deb887; }
    .board-chord { fill: #d2b48c; }
    .board-qp { fill: #c4a574; }
    .board-sb { fill: #b8956e; }
    .dim-line { stroke: #555; stroke-width: 1; marker-end: url(#arrow); marker-start: url(#arrow-start); }
    .dim-tick { stroke: #555; stroke-width: 1; }
    .dim-text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .dim-text-bg { fill: white; }
    .label { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
    <marker id="arrow-start" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M6,0 L6,6 L0,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="378" y="30" class="title" text-anchor="middle">Queen-Post Truss - 12' Span, 6/12 Pitch</text>

  <!-- Boards -->
  <polygon points="60.0,208.0 636.0,208.0 636.0,222.0 60.0,222.0" class="board board-chord" />
  <polygon points="60.0,192.3 348.0,48.3 348.0,64.0 60.0,208.0" class="board board-rafter" />
  <polygon points="348.0,48.3 636.0,192.3 636.0,208.0 348.0,64.0" class="board board-rafter" />
  <polygon points="259.0,108.5 245.0,115.5 245.0,208.0 259.0,208.0" class="board board-qp" />
  <polygon points="451.0,115.5 437.0,108.5 437.0,208.0 451.0,208.0" class="board board-qp" />
  <polygon points="259.0,108.5 437.0,108.5 437.0,122.5 259.0,122.5" class="board board-sb" />

  <!-- Board Labels -->
  <text x="348.0" y="215.0" class="label" text-anchor="middle" dominant-baseline="middle">Bottom Chord (2x4) - 12'</text>
  <text x="204.0" y="128.2" class="label" text-anchor="middle" dominant-baseline="middle" transform="rotate(-26.565051177077976, 204.0, 128.2)">Left Rafter (2x4) 6'-10.2", cut 26.6°</text>
  <text x="492.0" y="128.2" class="label" text-anchor="middle" dominant-baseline="middle" transform="rotate(-333.434948822922, 492.0, 128.2)">Right Rafter (2x4) 6'-10.2", cut 26.6°</text>
  <text x="252.0" y="160.0" class="label" text-anchor="middle" dominant-baseline="middle">2x4 2'-0.9", cut 26.6°</text>
  <text x="444.0" y="160.0" class="label" text-anchor="middle" dominant-baseline="middle">2x4 2'-0.9", cut 26.6°</text>
  <text x="348.0" y="115.5" class="label" text-anchor="middle" dominant-baseline="middle">Straining Beam (2x4) - 3'-8.5"</text>

  <!-- Overall Dimensions -->
  <line x1="70" y1="282" x2="626" y2="282" class="dim-line" />
  <line x1="60" y1="302" x2="60" y2="262" class="dim-tick" />
  <line x1="636" y1="302" x2="636" y2="262" class="dim-tick" />
  <text x="348" y="300" class="dim-text" text-anchor="middle">Span: 12'</text>
  <line x1="716" y1="218" x2="716" y2="54" class="dim-line" />
  <line x1="696" y1="208" x2="736" y2="208" class="dim-tick" />
  <line x1="696" y1="64" x2="736" y2="64" class="dim-tick" />
  <text x="731" y="136" class="dim-text" dominant-baseline="middle">Rise: 3'</text>
  <text x="252" y="203" class="dim-text" text-anchor="middle">QP @ 4'</text>
</svg>
